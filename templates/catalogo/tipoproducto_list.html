{% extends "base.html" %}
{% block title %}Product Types — CUADRA{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Product Types</h1>
    <a href="{% url 'catalogo:tipoproducto_create' %}" class="btn btn-success">+ New Product Type</a>
  </div>
  {% if tipos %}
    <ul class="list-group" style="max-width: 420px;">
      {% for t in tipos %}<li class="list-group-item">{{ t.nombre }}</li>{% endfor %}
    </ul>
  {% else %}
    <p class="text-muted">No product types registered yet.</p>
  {% endif %}
{% endblock %}
