{% extends "base.html" %}

{% block title %}Reactivate user — CUADRA{% endblock %}

{% block content %}
<h4 class="mb-4">Reactivate user</h4>
<div class="alert alert-info col-md-6">
  Are you sure you want to reactivate <strong>{{ usuario.nombre }}</strong> ({{ usuario.username }})?
  The user will be able to log in again.
</div>
<form method="post" class="col-md-6">
  {% csrf_token %}
  <button type="submit" class="btn btn-success">CONFIRM</button>
  <a href="{% url 'usuarios:usuario_list' %}" class="btn btn-secondary">CANCEL</a>
</form>
{% endblock %}
