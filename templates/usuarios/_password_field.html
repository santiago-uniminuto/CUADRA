<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
  <div class="input-group">
    {{ field }}
    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="{{ field.id_for_label }}"
            aria-label="Show or hide password">Show</button>
  </div>
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
