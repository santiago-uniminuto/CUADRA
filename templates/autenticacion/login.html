{% extends "base.html" %}

{% block title %}Sign in — CUADRA{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
  <div class="card shadow-sm mt-5" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h4 class="card-title mb-4 text-center">Sign in</h4>

      {% if form.non_field_errors %}
        <div class="alert alert-danger">
          {% for error in form.non_field_errors %}{{ error }}{% endfor %}
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
          {{ form.username.errors }}
          <input type="text" name="{{ form.username.html_name }}"
                 class="form-control" id="{{ form.username.id_for_label }}"
                 required autofocus>
        </div>
        <div class="mb-3">
          <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
          {{ form.password.errors }}
          <input type="password" name="{{ form.password.html_name }}"
                 class="form-control" id="{{ form.password.id_for_label }}"
                 required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
