<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CUADRA{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% if user.is_authenticated %}
  <nav class="navbar navbar-light bg-light mb-3">
    <div class="container-fluid justify-content-end">
      <span class="me-2">{{ user.username }} ({{ user.get_rol_display }})</span>
      <form method="post" action="{% url 'autenticacion:logout' %}" class="d-inline">
        {% csrf_token %}
        <a href="{% url 'autenticacion:logout' %}" class="btn btn-outline-secondary btn-sm">Log out</a>
      </form>
    </div>
  </nav>
  {% endif %}
  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
